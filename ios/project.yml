name: Voxera
options:
  bundleIdPrefix: com.vanoprojects
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "15.0"
packages:
  LiquidGlass:
    url: https://github.com/BarredEwe/LiquidGlass
    minorVersion: 0.8.0
  Firebase:
    url: https://github.com/firebase/firebase-ios-sdk
    majorVersion: 11.0.0
  GoogleSignIn:
    url: https://github.com/google/GoogleSignIn-iOS
    majorVersion: 8.0.0
settings:
  base:
    SWIFT_VERSION: "6.0"
    TARGETED_DEVICE_FAMILY: "1"
    ASSETCATALOG_COMPILER_GENERATE_SWIFT_ASSET_SYMBOL_EXTENSIONS: YES
    ENABLE_USER_SCRIPT_SANDBOXING: NO
targets:
  Voxera:
    type: application
    platform: iOS
    dependencies:
      - package: LiquidGlass
      - package: Firebase
        product: FirebaseCore
      - package: Firebase
        product: FirebaseAuth
      - package: GoogleSignIn
        product: GoogleSignIn
    sources:
      - path: Voxera
        excludes:
          - "**/*.md"
          - "**/AppStrings.struct.tmp"
    resources:
      - path: Voxera/Resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.vanoprojects.voxera.app
        INFOPLIST_FILE: Voxera/Info.plist
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: ""
        CURRENT_PROJECT_VERSION: "7"
        MARKETING_VERSION: "1.0"
        GENERATE_INFOPLIST_FILE: NO
        SWIFT_EMIT_LOC_STRINGS: YES
    configFiles:
      Debug: Voxera/Config.xcconfig
      Release: Voxera/Config.xcconfig
    preBuildScripts:
      - name: Generate API Token
        basedOnDependencyAnalysis: false
        script: |
          bash "${SRCROOT}/scripts/GenerateAPIToken.sh"
